<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>에너지 러시 - 퀀텀 유저 거래소 에디션</title>

<!-- Google Identity Services & Firebase SDK -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  --bg-color: #07090e;
  --card-bg: rgba(18, 24, 38, 0.85);
  --card-solid: #121826;
  --border-color: rgba(217, 119, 6, 0.2);
  --border-hover: rgba(245, 158, 11, 0.5);
  --accent: #f59e0b;
  --gold-grad: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
  --text-main: #fef3c7;
  --text-sub: #9ca3af;
}

*{box-sizing:border-box}
body{
  margin:0; font-family:'Pretendard', sans-serif;
  background: var(--bg-color); color: var(--text-main);
  min-height:100vh; padding: 20px; display: flex; justify-content: center; align-items: center;
}

.layout-container { display: flex; gap: 20px; width: min(1200px, 98vw); align-items: flex-start; }
.game { flex: 1; background: var(--card-bg); backdrop-filter: blur(16px); border: 1px solid var(--border-color); border-radius: 24px; padding: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.7); }
h1{ font-size: 26px; text-align: center; margin: 0 0 6px; background: linear-gradient(135deg, #fff, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.sub{ text-align: center; color: var(--text-sub); margin-bottom: 20px; font-size: 13px; }

.top-tools{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
.user-profile{ display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.02); padding: 6px 14px; border-radius: 14px; border: 1px solid var(--border-color); }
.user-avatar{ width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); }
.user-name{ font-weight: 600; color: var(--accent); font-size: 13px; }

.stats{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
.stat{ background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 14px; padding: 12px; text-align: center; }
.stat span { font-size: 11px; color: var(--text-sub); }
.stat b{ display: block; font-size: 16px; margin-top: 4px; color: var(--accent); }

.panel{ background: rgba(255,255,255,0.015); border: 1px solid var(--border-color); border-radius: 18px; padding: 20px; margin-bottom: 15px; }
.market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 12px; max-height: 350px; overflow-y: auto; padding-right: 4px; }
.market-card { background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }

.btn-game, .btn-market { padding: 8px 14px; border: none; border-radius: 10px; background: var(--gold-grad); color: #fff; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; }
.btn-game:hover, .btn-market:hover { filter: brightness(1.1); transform: translateY(-1px); }
.input-field { width: 100%; padding: 8px; border-radius: 10px; border: 1px solid var(--border-color); background: rgba(7, 9, 14, 0.9); color: var(--text-main); margin-bottom: 8px; font-size: 13px; }
#message { height: 22px; text-align: center; color: var(--accent); font-weight: 700; font-size: 13px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="layout-container">
  <div class="game">
    <div class="top-tools">
      <div class="user-profile">
        <img id="userAvatar" class="user-avatar" src="https://via.placeholder.com/32" alt="프로필">
        <span class="user-name" id="userName">구글 로그인 필요</span>
      </div>
      <div id="g_id_onload"
           data-client_id="458198508620-vfgev33kmafqufdgoj8n5bqgfuk1l998.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin" data-type="standard" data-size="medium" data-theme="outline" data-text="sign_in_with"></div>
    </div>

    <h1>🌐 퀀텀 유저 간 실시간 거래소</h1>
    <div class="sub">구글 계정 인증을 통해 보유한 드론을 등록하고 다른 연구원들과 거래하세요!</div>

    <div id="message"></div>

    <div class="stats">
      <div class="stat"><span>내 에너지 잔고</span><b id="score">50,000</b></div>
      <div class="stat"><span>보유 보석 💎</span><b id="gemCount">10</b></div>
      <div class="stat"><span>보유 드론 수</span><b id="myPetCount">0</b></div>
    </div>

    <!-- 드론 등록 패널 -->
    <div class="panel">
      <h3 style="color:var(--accent); margin-top:0; font-size:14px;">🏷️ 내 드론 마켓에 판매 등록하기</h3>
      <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
        <select id="myPetSelect" class="input-field" style="flex:2; margin-bottom:0;">
          <option value="">판매할 드론을 선택하세요</option>
        </select>
        <input type="number" id="listingPriceInput" class="input-field" style="flex:1; margin-bottom:0;" placeholder="판매 가격 (에너지)" min="100" value="5000">
        <button class="btn-game" id="registerListingBtn" style="background:linear-gradient(135deg, #10b981, #059669);">마켓에 등록</button>
      </div>
    </div>

    <!-- 마켓 매물 목록 패널 -->
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="color:var(--text-main); margin:0; font-size:14px;">🛒 실시간 유저 거래 마켓플레이스</h3>
        <button class="btn-game" id="refreshMarketBtn" style="padding:5px 10px; font-size:11px;">🔄 새로고침</button>
      </div>
      <div id="marketListContainer" class="market-grid">
        <p style="color:var(--text-sub); font-size:12px; text-align:center; grid-column:1/-1;">등록된 매물을 불러오는 중...</p>
      </div>
    </div>
  </div>
</div>

<script>
// Firebase 설정
const firebaseConfig = {
    apiKey: "AIzaSyDVSpWYQJHulEzt5Z7pW4k6LWPWXAmQKYg",
    authDomain: "coin-rush-b8cdc.firebaseapp.com",
    projectId: "coin-rush-b8cdc",
    storageBucket: "coin-rush-b8cdc.firebasestorage.app",
    messagingSenderId: "531183128462",
    appId: "1:531183128462:web:a9d9c88a6ef57827925edf"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 드론 데이터베이스 정의
const PET_DB = {
  cat: { name:'미니 탐사 드론', icon:'🛸', grade:'C' },
  dog: { name:'자동 채굴 로봇', icon:'🤖', grade:'B' },
  fox: { name:'오버클럭 유닛', icon:'⚙️', grade:'A' },
  dragon: { name:'앤서니 코어 드론', icon:'🚀', grade:'S' },
  legend: { name:'옴니버스 싱귤래리티', icon:'👑', grade:'L' }
};

// 유저 데이터 초기화 (테스트용 기본 드론 제공)
let d = JSON.parse(localStorage.getItem("quantumMarketUser") || JSON.stringify({
  score: 50000,
  gems: 10,
  pets: ['cat', 'dog', 'dragon']
}));

let currentUser = JSON.parse(localStorage.getItem("energyRushGoogleUser") || "null");

function say(t) {
  const msg = document.getElementById("message");
  if(!msg) return;
  msg.textContent = t;
  setTimeout(() => { if(msg.textContent === t) msg.textContent = ""; }, 2000);
}

function fmt(n) { return Math.floor(n).toLocaleString(); }

function updateUI() {
  document.getElementById("score").textContent = fmt(d.score);
  document.getElementById("gemCount").textContent = fmt(d.gems);
  document.getElementById("myPetCount").textContent = d.pets.length;

  const select = document.getElementById("myPetSelect");
  select.innerHTML = '<option value="">판매할 드론을 선택하세요</option>';
  d.pets.forEach((petId, idx) => {
    const pet = PET_DB[petId] || { name: petId, icon: '📦', grade: 'C' };
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = `[${pet.grade}급] ${pet.name} (${pet.icon})`;
    select.appendChild(opt);
  });

  if (currentUser) {
    document.getElementById("userName").textContent = currentUser.name;
    document.getElementById("userAvatar").src = currentUser.picture;
  }
}

function saveLocal() {
  localStorage.setItem("quantumMarketUser", JSON.stringify(d));
  updateUI();
}

// 구글 로그인 콜백
function parseJwt(token) {
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
  } catch (e) { return null; }
}

function handleCredentialResponse(response) {
  const payload = parseJwt(response.credential);
  if (payload) {
    currentUser = { googleId: payload.sub, name: payload.name, picture: payload.picture };
    localStorage.setItem("energyRushGoogleUser", JSON.stringify(currentUser));
    updateUI();
    say(`환영합니다, ${currentUser.name} 연구원님!`);
  }
}

// 1. 마켓에 드론 등록하기
document.getElementById("registerListingBtn").onclick = () => {
  if (!currentUser) return say("⚠️ 구글 로그인을 먼저 진행해주세요.");
  const selectIdx = document.getElementById("myPetSelect").value;
  if (selectIdx === "") return say("판매할 드론을 선택해주세요.");
  const price = parseInt(document.getElementById("listingPriceInput").value);
  if (isNaN(price) || price <= 10) return say("올바른 판매 가격을 입력해주세요.");

  const petId = d.pets[selectIdx];
  const petInfo = PET_DB[petId] || { name: petId, icon: '📦', grade: 'C' };

  // 내 인벤토리에서 드론 제거
  d.pets.splice(selectIdx, 1);
  saveLocal();

  // 파이어스토어 마켓 컬렉션에 등록
  db.collection("market_listings").add({
    sellerId: currentUser.googleId,
    sellerName: currentUser.name,
    petId: petId,
    petName: petInfo.name,
    petIcon: petInfo.icon,
    petGrade: petInfo.grade,
    price: price,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    say("✨ 마켓에 드론이 성공적으로 등록되었습니다!");
    loadMarketListings();
  }).catch(err => {
    say("등록 실패: 네트워크 상태를 확인해주세요.");
  });
};

// 2. 마켓 매물 불러오기
function loadMarketListings() {
  const container = document.getElementById("marketListContainer");
  container.innerHTML = "<p style='color:var(--text-sub); font-size:12px; text-align:center; grid-column:1/-1;'>매물을 불러오는 중...</p>";

  db.collection("market_listings").orderBy("createdAt", "desc").limit(20).get().then(snapshot => {
    if (snapshot.empty) {
      container.innerHTML = "<p style='color:var(--text-sub); font-size:12px; text-align:center; grid-column:1/-1;'>현재 등록된 마켓 매물이 없습니다.</p>";
      return;
    }

    let html = "";
    snapshot.forEach(doc => {
      const item = doc.data();
      const docId = doc.id;
      const isMyItem = currentUser && currentUser.googleId === item.sellerId;

      html += `
        <div class="market-card">
          <div>
            <span style="font-size:10px; background:#374151; padding:2px 6px; border-radius:4px;">판매자: ${item.sellerName}</span>
            <div style="font-size:28px; text-align:center; margin:8px 0;">${item.petIcon}</div>
            <b style="font-size:13px; display:block; text-align:center;">${item.petName}</b>
            <p style="font-size:11px; color:var(--accent); text-align:center; margin:4px 0;">가격: ${fmt(item.price)} 에너지</p>
          </div>
          <div>
            ${isMyItem ? 
              `<button class="btn-market" style="width:100%; background:#4b5563;" disabled>내 등록 매물</button>` : 
              `<button class="btn-market" style="width:100%; background:linear-gradient(135deg, #10b981, #059669);" onclick="buyListing('${docId}', ${item.price}, '${item.petId}')">구매하기</button>`
            }
          </div>
        </div>
      `;
    });
    container.innerHTML = html;
  }).catch(err => {
    container.innerHTML = "<p style='color:#ef4444; font-size:12px; text-align:center; grid-column:1/-1;'>매물을 불러오지 못했습니다.</p>";
  });
}

// 3. 마켓 매물 구매하기 (트랜잭션 안전 처리)
window.buyListing = (docId, price, petId) => {
  if (!currentUser) return say("⚠️ 로그인이 필요합니다.");
  if (d.score < price) return say("에너지가 부족하여 구매할 수 없습니다.");

  db.collection("market_listings").doc(docId).get().then(doc => {
    if (!doc.exists) {
      alert("이미 다른 연구원이 구매했거나 만료된 매물입니다.");
      loadMarketListings();
      return;
    }

    // 구매 진행
    d.score -= price;
    d.pets.push(petId);
    saveLocal();

    // 파이어스토어에서 매물 문서 삭제
    db.collection("market_listings").doc(docId).delete().then(() => {
      say("🎉 마켓에서 드론을 성공적으로 구매했습니다!");
      loadMarketListings();
    });
  });
};

document.getElementById("refreshMarketBtn").onclick = loadMarketListings;

// 초기 실행
document.addEventListener("DOMContentLoaded", () => {
  updateUI();
  loadMarketListings();
});
</script>
</body>
</html>
