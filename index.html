<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코인 러시 (Coin Rush)</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 500px; background: #1e293b; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #fbbf24; margin-bottom: 16px; font-size: 28px; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #334155; color: #94a3b8; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #fbbf24; color: #0f172a; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .score-box { text-align: center; background: #0f172a; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .coin-val { font-size: 32px; font-weight: bold; color: #fbbf24; }
        .click-btn { width: 100%; padding: 20px; font-size: 20px; font-weight: bold; background: #fbbf24; color: #0f172a; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.1s; }
        .click-btn:active { transform: scale(0.98); }
        .auth-card { background: #0f172a; padding: 16px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .user-profile { display: flex; align-items: center; gap: 12px; justify-content: center; }
        .user-profile img { width: 40px; height: 40px; border-radius: 50%; }
        .rank-list { list-style: none; }
        .rank-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #0f172a; margin-bottom: 8px; border-radius: 8px; }
        .rank-user { display: flex; align-items: center; gap: 10px; }
        .rank-user img { width: 32px; height: 32px; border-radius: 50%; }
        .rank-num { font-weight: bold; color: #fbbf24; width: 24px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🪙 코인 러시</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('game')">🎮 게임</button>
        <button class="tab-btn" onclick="switchTab('rank')">🏆 실시간 랭킹</button>
    </div>

    <!-- 게임 탭 -->
    <div id="tab-game" class="tab-content active">
        <div class="score-box">
            <div>보유 코인</div>
            <div class="coin-val" id="scoreDisplay">0</div>
        </div>
        <button class="click-btn" onclick="addCoin()">🪙 코인 채굴하기!</button>
    </div>

    <!-- 랭킹 탭 -->
    <div id="tab-rank" class="tab-content">
        <div class="auth-card">
            <div id="g_id_onload"
                 data-client_id="458198508620-vfgev33kmafqufdgoj8n5bqqgfuk1l998.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div id="loginSection">
                <div class="g_id_signin" data-type="standard"></div>
            </div>
            <div id="profileSection" style="display: none;" class="user-profile">
                <img id="userImg" src="" alt="Profile">
                <div>
                    <strong id="userName"></strong>님 환영합니다!
                    <br><small style="color:#a855f7;">점수가 실시간 서버에 자동 등록됩니다.</small>
                </div>
            </div>
        </div>

        <h3>🔥 실시간 글로벌 TOP 랭킹</h3>
        <ul class="rank-list" id="rankList">
            <li style="text-align: center; padding: 20px; color: #94a3b8;">랭킹 불러오는 중...</li>
        </ul>
    </div>
</div>

<script>
    // --- Firebase 초기화 ---
    const firebaseConfig = {
        apiKey: "AIzaSyDVSpWYQJHulEzt5Z7pW4k6LWPWXAmQKYg",
        authDomain: "coin-rush-b8cdc.firebaseapp.com",
        projectId: "coin-rush-b8cdc",
        storageBucket: "coin-rush-b8cdc.firebasestorage.app",
        messagingSenderId: "531183128462",
        appId: "1:531183128462:web:a9d9c88a6ef57827925edf",
        measurementId: "G-WHT7PS0L7D"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // --- 게임 상태 ---
    let score = parseInt(localStorage.getItem('coin_score') || '0');
    let currentUser = null;

    document.getElementById('scoreDisplay').innerText = score.toLocaleString();

    function addCoin() {
        score += 1;
        document.getElementById('scoreDisplay').innerText = score.toLocaleString();
        localStorage.setItem('coin_score', score);
        
        // 로그인 상태면 실시간 DB 점수 업로드
        if (currentUser) {
            syncScoreToFirebase();
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        
        if(tabName === 'game') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-game').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-rank').classList.add('active');
            loadGlobalRankings();
        }
    }

    // --- Google 로그인 처리 ---
    function parseJwt(token) {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
        const payload = parseJwt(response.credential);
        currentUser = {
            uid: payload.sub,
            name: payload.name,
            picture: payload.picture
        };

        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('profileSection').style.display = 'flex';
        document.getElementById('userName').innerText = currentUser.name;
        document.getElementById('userImg').src = currentUser.picture;

        syncScoreToFirebase();
    }

    // --- Firebase DB 연동 ---
    function syncScoreToFirebase() {
        if (!currentUser) return;
        
        db.collection('rankings').doc(currentUser.uid).set({
            name: currentUser.name,
            picture: currentUser.picture,
            score: score,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).then(() => {
            loadGlobalRankings();
        });
    }

    function loadGlobalRankings() {
        db.collection('rankings')
          .orderBy('score', 'desc')
          .limit(10)
          .get()
          .then((snapshot) => {
              const rankList = document.getElementById('rankList');
              rankList.innerHTML = '';
              
              if (snapshot.empty) {
                  rankList.innerHTML = '<li style="text-align:center; padding:15px; color:#94a3b8;">아직 등록된 랭킹이 없습니다!</li>';
                  return;
              }

              let rank = 1;
              snapshot.forEach((doc) => {
                  const data = doc.data();
                  const li = document.createElement('li');
                  li.className = 'rank-item';
                  li.innerHTML = `
                      <div class="rank-user">
                          <span class="rank-num">${rank}</span>
                          <img src="${data.picture || 'https://via.placeholder.com/32'}" alt="profile">
                          <span>${data.name}</span>
                      </div>
                      <strong style="color:#fbbf24;">${(data.score || 0).toLocaleString()} 코인</strong>
                  `;
                  rankList.appendChild(li);
                  rank++;
              });
          });
    }
</script>

</body>
</html>
