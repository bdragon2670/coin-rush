<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>구글 연동 코어 템플릿</title>

<!-- 브라우저 탭 아이콘 (SVG Favicon) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%230f172a%22/><text y=%22.8em%22 x=%2220%22 font-size=%2260%22 fill=%22%2338bdf8%22>🌐</text></svg>">

<!-- Google Identity Services SDK -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Firebase SDK (v9 Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<style>
:root {
  --bg-color: #0f172a;
  --card-bg: #1e293b;
  --border-color: #334155;
  --accent: #38bdf8;
  --accent-hover: #0ea5e9;
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  min-height:100vh;
  padding:20px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game{
  width: min(600px, 96vw);
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 25px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  position: relative;
}

h1{
  font-size: 24px;
  text-align: center;
  margin: 0 0 4px;
  color: var(--text-main);
  font-weight: 700;
}
.sub{
  text-align: center;
  color: var(--text-sub);
  margin-bottom: 20px;
  font-size: 12px;
}

.top-tools{
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}

.user-profile{
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,0.03);
  padding: 6px 12px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
}
.user-avatar{width: 28px; height: 28px; border-radius: 50%; object-fit: cover;}
.user-name{font-weight: 600; color: var(--accent); font-size: 12px;}

.top-right-btns {
  display: flex;
  gap: 8px;
  align-items: center;
}

.tool-btn{
  padding: 6px 12px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  color: var(--text-main);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.tool-btn:hover{background: rgba(255,255,255,0.1);}

.alarm-btn {
  position: relative;
  background: rgba(56, 189, 248, 0.1);
  border: 1px solid var(--accent);
  color: var(--accent);
}
.alarm-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  width: 8px;
  height: 8px;
  background: #f43f5e;
  border-radius: 50%;
  display: none;
}
.alarm-badge.active { display: block; }

.modal-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.7);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}
.modal-overlay.hidden { display: none; }
.modal-box {
  background: var(--card-bg);
  border: 1px solid var(--accent);
  border-radius: 16px;
  width: min(500px, 90vw);
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 10px;
  margin-bottom: 12px;
}
.modal-header h2 { margin: 0; font-size: 16px; color: var(--accent); }
.close-modal { background: none; border: none; color: var(--text-sub); font-size: 18px; cursor: pointer; }
.modal-body {
  overflow-y: auto;
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.5;
  padding-right: 4px;
}
.patch-item {
  margin-bottom: 14px;
  background: rgba(15, 23, 42, 0.6);
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
}
.patch-item h4 { margin: 0 0 4px; color: var(--text-main); font-size: 13px; }

.panel{
  background: rgba(15, 23, 42, 0.4);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
}

.google-box{
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 16px;
  text-align: center;
  margin-bottom: 15px;
}

.btn-game {
  padding: 8px 16px;
  border: none;
  border-radius: 6px;
  background: var(--accent);
  color: #0f172a;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-game:hover { background: var(--accent-hover); }

.rank-table{width: 100%; border-collapse: collapse; margin-top: 10px;}
.rank-table th, .rank-table td{padding: 8px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 11px;}
.rank-table th{background: rgba(255,255,255,0.03); color: var(--accent); font-weight: 600;}
.rank-user-info{display: flex; align-items: center; justify-content: center; gap: 6px;}
.rank-user-avatar{width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--accent);}

.my-rank-banner {
  margin-top: 12px;
  background: rgba(56, 189, 248, 0.08);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
}
</style>
</head>
<body>
<div class="game">
<div class="top-tools">
  <div class="user-profile" id="userProfileArea">
    <img src="https://via.placeholder.com/32/7f8c8d/ffffff?text=?" id="userAvatar" class="user-avatar">
    <span class="user-name" id="userName">게스트 (미로그인)</span>
  </div>
  <div class="top-right-btns">
    <button class="tool-btn alarm-btn" id="openPatchNoteBtn">📢 패치노트 <span class="alarm-badge active" id="alarmBadge"></span></button>
  </div>
</div>

<!-- 패치노트 모달 팝업 -->
<div class="modal-overlay hidden" id="patchModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2>📜 패치노트 & 업데이트 내역</h2>
      <button class="close-modal" id="closePatchNoteBtn">&times;</button>
    </div>
    <div class="modal-body" id="patchNoteContent">
      <!-- 패치노트 동적 생성 -->
    </div>
  </div>
</div>

<h1>🌐 구글 연동 랭킹 코어</h1>
<div class="sub">모든 콘텐츠가 초기화된 클린 템플릿</div>

<div class="panel">
  <div class="google-box">
    <h3 style="color:var(--text-main);margin:0 0 10px;font-size:14px;">Google 계정 로그인</h3>
    
    <div id="g_id_onload"
         data-client_id="458198508620-vfgev33kmafqufdgoj8n5bqgfuk1l998.apps.googleusercontent.com"
         data-callback="handleCredentialResponse"
         data-auto_prompt="false">
    </div>
    
    <div style="display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;">
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
    </div>

    <div style="margin-top:12px;">
      <p style="margin:6px 0; font-size:12px;">내 기록 점수: <b id="myScore" style="color:var(--accent);">100</b> 포인트</p>
      <button id="registerRankBtn" class="btn-game">🏆 서버에 점수 동기화</button>
    </div>
  </div>

  <h3 style="text-align:center;color:var(--text-main);font-size:14px;margin:15px 0 8px;">🏆 글로벌 랭킹 Top 10</h3>
  <table class="rank-table">
    <thead>
      <tr>
        <th>순위</th>
        <th>사용자</th>
        <th>점수</th>
      </tr>
    </thead>
    <tbody id="rankList"></tbody>
  </table>

  <div class="my-rank-banner" id="myRankDisplay">
    내 순위: 조회 중...
  </div>
</div>

</div>

<script>
// --- 패치노트 데이터 (보존) ---
const patchNotes = [
  {
    version: "v1.0 패치 (클린 버전)",
    title: "구글 연동 및 랭킹 전용 코어 템플릿",
    desc: "1) 모든 기존 게임 콘텐츠와 로컬 저장 데이터가 완전히 초기화되었습니다.\n2) Google Identity Services 및 Firebase 클라우드 랭킹 시스템만 남겨진 순수 연동 템플릿입니다."
  }
];

function renderPatchNotes() {
  const container = document.getElementById("patchNoteContent");
  if(!container) return;
  container.innerHTML = "";
  patchNotes.forEach(note => {
    const div = document.createElement("div");
    div.className = "patch-item";
    div.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <h4 style="margin:0; color:var(--accent);">${note.version}: ${note.title}</h4>
      </div>
      <p style="margin:0; font-size:11px; color:var(--text-sub); white-space: pre-line;">${note.desc}</p>
    `;
    container.appendChild(div);
  });
}

// --- Firebase 초기화 ---
const firebaseConfig = {
    apiKey: "AIzaSyDVSpWYQJHulEzt5Z7pW4k6LWPWXAmQKYg",
    authDomain: "coin-rush-b8cdc.firebaseapp.com",
    projectId: "coin-rush-b8cdc",
    storageBucket: "coin-rush-b8cdc.firebasestorage.app",
    messagingSenderId: "531183128462",
    appId: "1:531183128462:web:a9d9c88a6ef57827925edf",
    measurementId: "G-WHT7PS0L7D"
};
if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}
const db = firebase.firestore();

let currentUser = JSON.parse(localStorage.getItem("cleanGoogleUser") || "null");
let myScore = 100; // 테스트용 기본 점수

function parseJwt(token) {
  try {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  } catch (e) { return null; }
}

function handleCredentialResponse(response) {
  const responsePayload = parseJwt(response.credential);
  if (responsePayload) {
    currentUser = {
      googleId: responsePayload.sub,
      name: responsePayload.name,
      picture: responsePayload.picture,
      email: responsePayload.email
    };
    localStorage.setItem("cleanGoogleUser", JSON.stringify(currentUser));
    updateUserUI();
    syncScoreToFirebase();
  }
}

function updateUserUI() {
  const userAvatar = document.getElementById("userAvatar");
  const userName = document.getElementById("userName");
  if (currentUser) {
    if(userAvatar) userAvatar.src = currentUser.picture;
    if(userName) userName.textContent = currentUser.name;
  } else {
    if(userAvatar) userAvatar.src = "https://via.placeholder.com/32/7f8c8d/ffffff?text=?";
    if(userName) userName.textContent = "게스트 (미로그인)";
  }
  loadFirebaseRankings();
}

function syncScoreToFirebase() {
  if(!currentUser) return alert("구글 계정으로 먼저 로그인해주세요.");
  db.collection('clean_rankings').doc(currentUser.googleId).set({
    googleId: currentUser.googleId,
    name: currentUser.name,
    picture: currentUser.picture,
    score: myScore,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).then(() => {
    loadFirebaseRankings();
    alert("서버에 점수가 성공적으로 동기화되었습니다!");
  });
}

function loadFirebaseRankings(){
  db.collection('clean_rankings')
    .orderBy('score', 'desc')
    .get()
    .then((snapshot) => {
      const rankList = document.getElementById("rankList");
      const myRankDisplay = document.getElementById("myRankDisplay");
      if(!rankList) return;
      rankList.innerHTML = "";
      
      if(snapshot.empty) {
        rankList.innerHTML = "<tr><td colspan='3' style='color:var(--text-sub);'>등록된 랭킹이 없습니다.</td></tr>";
        if(myRankDisplay) myRankDisplay.textContent = "내 순위: 랭킹 없음";
        return;
      }
      
      let index = 0;
      let myRankFound = false;
      
      snapshot.forEach((doc) => {
        const item = doc.data();
        let medal = index === 0 ? "🥇 " : index === 1 ? "🥈 " : index === 2 ? "🥉 " : "";
        let isMyRank = currentUser && item.googleId === currentUser.googleId;
        
        if(isMyRank) {
          myRankFound = true;
          if(myRankDisplay) myRankDisplay.innerHTML = `내 순위: <b>${index + 1}위</b> (점수: ${item.score.toLocaleString()})`;
        }

        if(index < 10) {
          let tr = document.createElement("tr");
          if(isMyRank) tr.style.background = "rgba(56,189,248,0.05)";

          tr.innerHTML = `
            <td>${medal}${index + 1}위</td>
            <td>
              <div class="rank-user-info">
                <img src="${item.picture}" class="rank-user-avatar" onerror="this.src='https://via.placeholder.com/26'">
                <b>${item.name}</b> ${isMyRank ? '<small style="color:var(--accent)">(나)</small>' : ''}
              </div>
            </td>
            <td style="color:var(--accent);">${item.score.toLocaleString()}</td>
          `;
          rankList.appendChild(tr);
        }
        index++;
      });

      if(!myRankFound && myRankDisplay) {
        myRankDisplay.innerHTML = currentUser ? "내 순위: 10위 밖 (동기화 버튼을 눌러주세요)" : "내 순위: 미로그인 상태";
      }
    });
}

document.addEventListener("DOMContentLoaded", () => {
  const openBtn = document.getElementById("openPatchNoteBtn");
  const closeBtn = document.querySelector(".close-modal");
  const patchModal = document.getElementById("patchModal");
  const alarmBadge = document.getElementById("alarmBadge");

  if(openBtn) {
    openBtn.onclick = () => {
      if(patchModal) patchModal.classList.remove("hidden");
      if(alarmBadge) alarmBadge.classList.remove("active");
      localStorage.setItem("cleanLastCheckedPatch", patchNotes[0].version);
    };
  }

  if(closeBtn) {
    closeBtn.onclick = () => {
      if(patchModal) patchModal.classList.add("hidden");
    };
  }

  const regRankBtn = document.getElementById("registerRankBtn");
  if(regRankBtn) {
    regRankBtn.onclick = syncScoreToFirebase;
  }

  renderPatchNotes();
  const lastChecked = localStorage.getItem("cleanLastCheckedPatch");
  if(alarmBadge && lastChecked === patchNotes[0].version) {
    alarmBadge.classList.remove("active");
  }
  updateUserUI();
});
</script>
</body>
</html>
